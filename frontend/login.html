<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CareerPilot AI</title>
    
    <!-- Meta Descriptions for SEO -->
    <meta name="description" content="CareerPilot AI Login - Access your personalized resume reviews, ATS scoring, and AI interview trainer.">
    <meta name="keywords" content="CareerPilot, Login, Firebase Auth, Resume Assistant">
    <meta name="author" content="CareerPilot Team">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- Light Theme Enforcement -->
    <script>
        document.documentElement.classList.remove('dark-mode');
    </script>
</head>
<body>

    <main class="auth-container" id="main-content">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo" aria-label="CareerPilot Home">
                    <img src="assets/careerpilot-logo.png" alt="CareerPilot" class="brand-logo-img" style="height: 44px;">
                </a>
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-subtitle">Sign in to your CareerPilot AI account</p>
            </div>

            <!-- Error alert box -->
            <div id="auth-alert-box" class="alert-box" style="display: none; margin-bottom: 1.25rem;"></div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
                        <label for="password" class="form-label">Password</label>
                        <a href="forgot-password.html" style="font-size: 0.82rem; color: var(--primary); text-decoration: none;">Forgot password?</a>
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="password-toggle" aria-label="Show password" tabindex="-1">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" id="btn-login" style="width: 100%; margin-top: 0.5rem;">
                    <span>Sign In</span>
                </button>
            </form>

            <div class="auth-divider">Or continue with</div>

            <button type="button" class="google-auth-btn" id="btn-google-login">
                <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Sign in with Google</span>
            </button>

            <p class="auth-footer-text">
                Don't have an account? <a href="register.html">Sign up</a>
            </p>
        </div>
    </main>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
