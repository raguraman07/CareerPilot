<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - CareerPilot</title>
    
    <!-- Meta Descriptions for SEO -->
    <meta name="description" content="CareerPilot AI Register - Create your account to start optimizing your resume and building your AI career roadmap.">
    <meta name="keywords" content="CareerPilot, Register, Create Account, Firebase Auth, Resume Assistant">
    <meta name="author" content="CareerPilot Team">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- Light Theme Enforcement -->
    <script>
        document.documentElement.classList.remove('dark-mode');
    </script>
</head>
<body>

    <main class="auth-container" id="main-content">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo" aria-label="CareerPilot Home">
                    <img src="assets/careerpilot-logo.png" alt="CareerPilot" class="brand-logo-img" style="height: 44px;">
                </a>
                <h1 class="auth-title">Create an Account</h1>
                <p class="auth-subtitle">Join CareerPilot to start building your career</p>
            </div>

            <!-- Error alert box -->
            <div id="auth-alert-box" class="alert-box" style="display: none; margin-bottom: 1.25rem; background: rgba(220,38,38,0.1); color: #dc2626; border-color: rgba(220,38,38,0.2);"></div>

            <!-- Register Form -->
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="full-name" class="form-label">Full Name</label>
                    <input type="text" id="full-name" class="form-input" placeholder="Jane Doe" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
                </div>

                <button type="submit" class="btn btn-primary btn-lg" id="btn-register" style="width: 100%; margin-top: 0.5rem;">
                    <span>Create Account</span>
                </button>
            </form>

            <div class="auth-divider">Or continue with</div>

            <button type="button" class="google-auth-btn" id="btn-google-register">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Sign up with Google</span>
            </button>

            <p class="auth-footer-text">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </div>
    </main>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
