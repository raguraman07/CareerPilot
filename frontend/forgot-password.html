<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - CareerPilot</title>
    
    <!-- Meta Descriptions for SEO -->
    <meta name="description" content="CareerPilot Password Reset - Reset your CareerPilot account password.">
    <meta name="author" content="CareerPilot Team">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script>
        (function() {
            var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (t === 'dark') document.documentElement.classList.add('dark-mode');
        })();
    </script>
</head>
<body>

    <main class="auth-container" id="main-content">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo" aria-label="CareerPilot Home">
                    <div class="logo-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" stroke-width="2.5" fill="none">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                    </div>
                    <span>CareerPilot</span>
                </a>
                <h1 class="auth-title">Reset Password</h1>
                <p class="auth-subtitle">Enter your account email to receive a password reset link</p>
            </div>

            <div id="auth-alert-box" class="alert-box" style="display: none; margin-bottom: 1.25rem;"></div>

            <form id="forgot-password-form" class="auth-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
                </div>

                <button type="submit" class="btn btn-primary btn-lg" id="btn-forgot" style="width: 100%; margin-top: 0.5rem;">
                    <span>Send Password Reset Email</span>
                </button>
            </form>

            <p class="auth-footer-text">
                Remembered your password? <a href="login.html">Back to Sign in</a>
            </p>
        </div>
    </main>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
