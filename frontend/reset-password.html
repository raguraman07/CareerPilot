<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - CareerPilot</title>
    
    <!-- Meta Descriptions for SEO -->
    <meta name="description" content="CareerPilot Set New Password - Set a new password for your CareerPilot account.">
    <meta name="author" content="CareerPilot Team">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- Light Theme Enforcement -->
    <script>
        document.documentElement.classList.remove('dark-mode');
    </script>
</head>
<body>

    <main class="auth-container" id="main-content">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo" aria-label="CareerPilot Home">
                    <div class="logo-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" stroke-width="2.5" fill="none">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                    </div>
                    <span>CareerPilot</span>
                </a>
                <h1 class="auth-title">Set New Password</h1>
                <p class="auth-subtitle">Enter your new secure password below</p>
            </div>

            <div id="auth-alert-box" class="alert-box" style="display: none; margin-bottom: 1.25rem;"></div>

            <form id="reset-password-form" class="auth-form">
                <div class="form-group">
                    <label for="new-password" class="form-label">New Password</label>
                    <input type="password" id="new-password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirm-password" class="form-label">Confirm Password</label>
                    <input type="password" id="confirm-password" class="form-input" placeholder="Re-enter password" required autocomplete="new-password" minlength="6">
                </div>

                <button type="submit" class="btn btn-primary btn-lg" id="btn-reset" style="width: 100%; margin-top: 0.5rem;">
                    <span>Update Password</span>
                </button>
            </form>

            <p class="auth-footer-text">
                Back to <a href="login.html">Sign in</a>
            </p>
        </div>
    </main>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
